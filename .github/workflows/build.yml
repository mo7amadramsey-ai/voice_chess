name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Voice pack (neural voice, mastered, bundled inside the APK)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install edge-tts
          python tool/make_voice_pack.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android platform files
        run: flutter create --platforms=android --org com.voicechess --project-name voice_chess .
      - name: Patch Android manifest (microphone + speech recognition service; NO internet permission)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' $M
          sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.speech.RecognitionService"/></intent>#' $M
          sed -i 's#android:label="voice_chess"#android:label="شطرنج صوتي"#' $M
      - run: flutter pub get
      - name: Patch stockfish plugin for modern Gradle (jcenter removed)
        run: |
          PKG=$(ls -d "$HOME"/.pub-cache/hosted/pub.dev/stockfish-*/ | head -1)
          F="$PKG/android/build.gradle"
          sed -i 's/jcenter()/mavenCentral()/g' "$F"
          if ! grep -q namespace "$F"; then
            NS=$(grep -o 'package="[^"]*"' "$PKG/android/src/main/AndroidManifest.xml" | head -1 | cut -d'"' -f2)
            sed -i "0,/android {/s//android {\n    namespace '$NS'/" "$F"
          fi
          echo "----- patched $F"; cat "$F"
      - name: Voice-command brain tests
        run: dart run tool/parser_check.dart
      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: buildlog-${{ github.run_number }}
          name: build log ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: build.log
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk voice-chess.apk
      - uses: actions/upload-artifact@v4
        with:
          name: voice-chess-apk
          path: voice-chess.apk
      - name: Publish release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: شطرنج صوتي v0.2.${{ github.run_number }}
          files: voice-chess.apk
          make_latest: true
